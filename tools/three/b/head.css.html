<title>회계학 개념정리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 회계학 개념정리: 경제학 요약노트와 같은 틀. 결론 → 도식 → 함정 → 기출 */
:root{
  --bg:#f2f4f7; --paper:#fbfcfd; --grid:#e4e9f0; --rule:#d5dce6; --ink:#1b2230; --muted:#5a6578;
  --accent:#1f4f8a; --accent-ink:#ffffff; --demand:#1f4f8a; --supply:#b5562a; --gov:#7a5aa8;
  --area1:rgba(31,79,138,.16); --area2:rgba(181,86,42,.18); --dwl:rgba(178,58,46,.28);
  --hi:#b23a2e; --hi-bg:#f8e4e0; --ok:#1f7a4a; --mid:#9a6a12; --mid-bg:#f6ecd6;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --paper:#19202a; --grid:#212a36; --rule:#2e3946; --ink:#e4e9f0; --muted:#97a3b5;
  --accent:#7fb0ea; --accent-ink:#0e1520; --demand:#7fb0ea; --supply:#eb9a6e; --gov:#b79be0;
  --area1:rgba(127,176,234,.18); --area2:rgba(235,154,110,.2); --dwl:rgba(240,138,124,.32);
  --hi:#f08a7c; --hi-bg:#3a221e; --ok:#6fd39a; --mid:#e2b45a; --mid-bg:#3a3020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --paper:#19202a; --grid:#212a36; --rule:#2e3946; --ink:#e4e9f0; --muted:#97a3b5;
  --accent:#7fb0ea; --accent-ink:#0e1520; --demand:#7fb0ea; --supply:#eb9a6e; --gov:#b79be0;
  --area1:rgba(127,176,234,.18); --area2:rgba(235,154,110,.2); --dwl:rgba(240,138,124,.32);
  --hi:#f08a7c; --hi-bg:#3a221e; --ok:#6fd39a; --mid:#e2b45a; --mid-bg:#3a3020; color-scheme:dark}
:root[data-theme="light"]{color-scheme:only light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 80px;display:grid;gap:22px}
header{display:grid;gap:8px}
.eyebrow{font-size:12.5px;letter-spacing:.08em;color:var(--muted);font-weight:500}
h1{font-size:28px;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:22px;line-height:1.35;margin:0;text-wrap:balance}
h3{font-size:17px;margin:0}
p{margin:0}
.lede{color:var(--muted);font-size:15px}
nav.toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--rule)}
nav.toc a{flex:none;font-size:13.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--rule);color:var(--ink);text-decoration:none;background:var(--paper)}
nav.toc a:hover,nav.toc a:focus-visible{border-color:var(--accent);outline:none}
section{display:grid;gap:14px;scroll-margin-top:56px}
.sec{border:1px solid var(--rule);border-radius:12px;padding:22px 20px;display:grid;gap:16px;min-width:0;
  background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.shead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.badge{font:500 12.5px var(--f-body);padding:2px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);white-space:nowrap}
.badge.hi{border-color:var(--hi);color:var(--hi);background:var(--hi-bg)}
.badge.mid{border-color:var(--mid);color:var(--mid);background:var(--mid-bg)}
.badge.lo{color:var(--muted)}
.lec{font:500 12.5px var(--f-mono);color:var(--muted)}
.key{background:var(--paper);border:1.5px solid var(--accent);border-radius:10px;padding:12px 16px;font-size:16.5px;font-weight:500;line-height:1.6}
.key small{display:block;font-weight:400;color:var(--muted);font-size:13.5px;margin-top:4px}
.ask{font-size:14px;color:var(--muted);background:var(--paper)}
.ask b{color:var(--ink);font-weight:500}
.tw{overflow-x:auto;background:var(--paper);border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.55}
th,td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
.c1 td:first-child{min-width:5.2em}
.c1 table{min-width:520px}
td.tn{min-width:9.5em}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--ok);font-weight:700} .dn{color:var(--hi);font-weight:700}
ul.pts{margin:0;padding-left:20px;display:grid;gap:4px;background:var(--paper)}
.trap{border-left:3px solid var(--hi);padding:8px 12px;background:var(--paper);font-size:14.5px;display:grid;gap:4px}
.trap b{color:var(--hi)}
.mine{font-size:13.5px;color:var(--muted);background:var(--paper)}
.mine span{display:inline-block;font-family:var(--f-mono);font-size:12.5px;padding:0 7px;margin:2px 3px 2px 0;border-radius:6px;border:1px solid var(--hi);color:var(--hi)}
.steps{margin:0;padding:10px 14px 10px 32px;border-radius:8px;background:var(--bg);font-size:14.5px;display:grid;gap:4px}
.lab{border:1px solid var(--rule);border-radius:10px;background:var(--paper);padding:14px;display:grid;gap:10px}
.lab h3{font-size:15px}
.lab .hint{font-size:13px;color:var(--muted)}
.lab svg{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
svg text{fill:var(--ink);font-family:var(--f-mono);font-size:11px}
svg .ax{stroke:var(--muted);stroke-width:1.2;fill:none}
svg .d{stroke:var(--demand);stroke-width:2.6;fill:none}
svg .s{stroke:var(--supply);stroke-width:2.6;fill:none}
svg .g{stroke:var(--gov);stroke-width:2.4;fill:none}
svg .old{stroke-dasharray:5 4;opacity:.55}
svg .guide{stroke:var(--muted);stroke-width:.9;stroke-dasharray:3 3;fill:none}
svg .dot{fill:var(--ink)}
svg .lbl{font-size:12px;font-weight:500}
.ctrls{display:flex;flex-wrap:wrap;gap:6px}
.ctrls button{font:500 13.5px var(--f-body);padding:6px 11px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.ctrls button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.ctrls button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.slider{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px}
.slider input{width:100%}
.slider output{font-family:var(--f-mono);min-width:3.5em;text-align:right}
.readout{font-size:14.5px;background:var(--bg);border-radius:8px;padding:10px 12px;display:grid;gap:3px;font-variant-numeric:tabular-nums}
.readout b{font-family:var(--f-mono);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mini{border:1px solid var(--rule);border-radius:8px;padding:10px;background:var(--paper);display:grid;gap:6px;min-width:0}
.mini svg{width:100%;max-width:220px;height:auto;display:block;margin:0 auto}
.mini p{font-size:13.5px}
.mini h3{font-size:14.5px}
.foot{font-size:13px;color:var(--muted)}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle}
a{color:var(--accent)}

.drop{border-left:3px dashed var(--muted);padding:8px 12px;background:var(--paper);font-size:14.5px;display:grid;gap:4px}
.drop b{color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.flow span{border:1px solid var(--rule);border-radius:8px;padding:4px 10px;background:var(--paper)}
.flow small{color:var(--muted)}
.flow i{font-style:normal;color:var(--muted);background:var(--paper)}
.tree{display:grid;gap:8px}
.tree .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.tree .col{display:grid;gap:6px;align-content:start}
.node{border:1px solid var(--rule);border-radius:8px;padding:8px 12px;background:var(--paper);font-size:14.5px}
.node small{display:block;color:var(--muted);font-size:13px}
.node.root{border:1.5px solid var(--ink);font-weight:500;text-align:center}
.node.acc{border-color:var(--demand);color:var(--demand);font-weight:500}
.node.acc2{border-color:var(--supply);color:var(--supply);font-weight:500}
.je{overflow-x:auto;background:var(--paper);border:1px solid var(--rule);border-radius:8px}
.je th:nth-child(1),.je th:nth-child(2){color:var(--demand)}.je th:nth-child(3),.je th:nth-child(4){color:var(--supply)}
.readout .je{margin:4px 0}
svg .f-a{fill:var(--area1);stroke:var(--demand);stroke-width:1.5}
svg .f-l{fill:var(--area2);stroke:var(--supply);stroke-width:1.5}
svg .f-e{fill:var(--area1);stroke:var(--demand);stroke-width:1.5}
svg .f-inv{fill:var(--area1);stroke:var(--demand);stroke-width:1.5}
svg .f-loss{fill:var(--dwl)}
svg .f-short{fill:var(--area2)}
svg .f-bar{fill:var(--accent)}
</style>
